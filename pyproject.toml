[project]
name = "finzanjir-grounded-ai"
version = "0.1.0"
description = "Grounded FINZANJIR Knowledge Engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pillow>=10,<14",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "reportlab>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
