name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Validate JavaScript syntax and Cloudflare Worker tests
        run: node --check frontend/app.js && node --check frontend/google-cloud.js && node --check frontend/research.js && node --check infra/cloudflare/worker/src/index.mjs && node --test tests/cloudflare_worker.test.mjs
      - run: PYTHONPATH=src python -m pytest -q
      - name: Run read-only question decomposition diagnostic
        run: |
          PYTHONPATH=src python scripts/run_question_decomposition_diagnostic.py --output question-decomposition-diagnostic.json
      - name: Upload question decomposition diagnostic report
        uses: actions/upload-artifact@v7
        with:
          name: finzanjir-question-decomposition-diagnostic
          path: question-decomposition-diagnostic.json
          if-no-files-found: error
          retention-days: 14
